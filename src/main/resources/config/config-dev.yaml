# API specification
#Autodiscovery
api:
  #Replace with respective autodiscovery id 
  autodiscoveryID: "00000000"
  
#db
db:
  url: "jdbc:postgresql://ep-steep-rice-adkvbmf2-pooler.c-2.us-east-1.aws.neon.tech/student-course?sslmode=require&channelBinding=require"
  driver: "org.postgresql.Driver"
  user: "neondb_owner"
  
# Listener configuration
https:
  host: "0.0.0.0"
  port: "8082"

#API Configurations
orders-prc-api:   
  http-listener:
    path: "/api/*"
  http-client:
      client-id:  "Client Id overridden at deploy time"  
      client-secret: "Client secret overridden at deploy time"   

#AMQ Configurations
anypoint-mq:
    server-url: ""
    slsorders-queue-name: ""
    slsorders-dl-queue-name: ""
    fetchSize: "10"
    frequency: "10000"
    ackTimeout: "10000"
    client-id:  "Client Id overridden at deploy time" 
    client-secret: "Client secret overridden at deploy time"

# Retry configuration
retry:
   http: 
    delayMillisecs: "3000"
    numRetries: "3"
   amq:
    delayMillisecs: "3000"
    numRetries: "3"
    
# Reconnect configuration
reconnection:
   amq:
    frequency: "2000"
    attempts: "2"
   http: 
    delayMillisecs: "3000"
    numRetries: "3"
    
  
# Object Store configuration for Object Store: orders_lastupdated_store
order-lastupdated:
  entryTtl: "24"
  entryTtlUnit: "HOURS"
  maxEntries: "10"
  persistent: "true"
  expirationInterval: "30"
  expirationIntervalUnit: "MINUTES"  
